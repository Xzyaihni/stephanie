[package]
name = "stephanie"
version = "0.1.0"
edition = "2024"

[dependencies]
yanyaengine = { path = "yanyaengine" }
bytemuck = "1.23"
image = "0.25"
nalgebra = { version = "0.35", features = ["serde-serialize-no-std"] }
parking_lot = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
fastrand = "2.3"
strum = { version = "0.28", features = ["derive"] }
vulkano = "0.35"
vulkano-shaders = "0.35"
rust-lzma = "0.6"
serde_bare = { version = "0.5", features = ["std"] }
arboard = "3.6"
serde_with = "3.12.0"

[profile.release]
strip = true

[profile.dev]
strip = true
debug = false
opt-level = 1

[profile.dev-debug]
inherits = "dev"
strip = false
debug = 1

[profile.release-symbols]
inherits = "release"
strip = false
debug = false

[features]
stimings = []